[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "qis-index-risk-lab"
version = "0.1.0"
description = "An offline educational multi-asset index and calculation audit"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.3.3", "exchange-calendars==4.11.2"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]
[project.scripts]
qis-lab = "qis_lab.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
qis_lab = ["web/*"]
