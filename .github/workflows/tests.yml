name: Offline numerical validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check src tests
      - run: pytest -q
      - run: qis-lab demo --out results/synthetic
      - run: qis-lab build-site
# Dependency installation needs network. Tests and demo themselves require no
# network, credentials, external data or LLM. No publishing workflow is included.
